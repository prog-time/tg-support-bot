; Xdebug 3 — dev image only (app-dev), loaded alongside zz-custom.ini/zz-opcache.ini.
; xdebug.mode is controlled by the XDEBUG_MODE env var set in docker-compose.yml
; (native Xdebug 3 override, no ini value needed here — defaults to "off").
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.start_with_request=yes
xdebug.discover_client_host=false
